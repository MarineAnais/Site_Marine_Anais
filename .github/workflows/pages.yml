# Construit le site et le met en ligne sur GitHub Pages à chaque modification de `main`.
# Sur les autres branches (ex. retrait-lovable), le site est seulement construit pour
# vérifier que tout fonctionne : une croix rouge dans GitHub = quelque chose à corriger.
name: Site GitHub Pages

on:
  push:
    branches: [main, retrait-lovable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire le site (fichiers fixes)
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Affiche la fin du journal dans un encadré d'erreur facile à lire / à copier
            msg=$(tail -n 40 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Erreur pendant la construction du site::${msg}"
          fi
          exit $code
        env:
          STATIC_BUILD: "1"
          # Adresse github.io du dépôt. Passer à "/" une fois marineanais.fr branché.
          SITE_BASE: /artist-website-forge/

      - name: Finaliser le dossier publié
        run: |
          cd dist/client
          touch .nojekyll
          # Page affichée par GitHub Pages pour une adresse inconnue
          test -f 404.html || cp index.html 404.html

      - name: Vérifier le résultat
        run: |
          echo "Contenu du site généré :"
          find dist/client -maxdepth 2 -not -path '*/assets/*' | sort | head -60
          test -f dist/client/index.html
          # Contrôle : les fichiers CSS/JS doivent porter le préfixe du site
          if [ "$SITE_BASE" != "/" ]; then
            grep -q "${SITE_BASE}assets/" dist/client/index.html || { echo "::error::Le préfixe ${SITE_BASE} est absent de index.html"; exit 1; }
          fi
        env:
          SITE_BASE: /artist-website-forge/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
