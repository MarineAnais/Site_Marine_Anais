# Construit le site et le met en ligne sur GitHub Pages à chaque modification de `main`.
# Sur les autres branches (ex. retrait-lovable), le site est seulement construit pour
# vérifier que tout fonctionne : une croix rouge dans GitHub = quelque chose à corriger.
name: Site GitHub Pages

on:
  push:
    branches: [main, retrait-lovable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire le site (fichiers fixes)
        run: npm run build
        env:
          NITRO_PRESET: github_pages

      - name: Finaliser le dossier publié
        run: |
          cd .output/public
          touch .nojekyll
          # Page affichée par GitHub Pages pour une adresse inconnue
          test -f 404.html || cp index.html 404.html

      - name: Vérifier le résultat
        run: |
          echo "Contenu du site généré :"
          find .output/public -maxdepth 2 -not -path '*/assets/*' | sort | head -60
          test -f .output/public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
